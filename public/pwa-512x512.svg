<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle Inner Glass Layer -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#glass)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Memory Synapse Nodes & Connections -->
  <g filter="url(#shadow)">
    <!-- Circuit Lines -->
    <path d="M160 256 L256 160 L352 256 L256 352 Z" fill="none" stroke="url(#glow)" stroke-width="8" stroke-dasharray="8 6" opacity="0.6"/>
    <path d="M160 256 L352 256" stroke="url(#glow)" stroke-width="6" opacity="0.5"/>
    <path d="M256 160 L256 352" stroke="url(#glow)" stroke-width="6" opacity="0.5"/>

    <!-- Brain / Cognitive Nodes -->
    <circle cx="256" cy="160" r="32" fill="url(#glow)" />
    <circle cx="352" cy="256" r="32" fill="url(#glow)" />
    <circle cx="256" cy="352" r="32" fill="url(#glow)" />
    <circle cx="160" cy="256" r="32" fill="url(#glow)" />
    
    <!-- Central Core -->
    <circle cx="256" cy="256" r="44" fill="#ffffff" />
    <circle cx="256" cy="256" r="36" fill="url(#glow)" opacity="0.9" />
    <circle cx="256" cy="256" r="16" fill="#ffffff" />
  </g>
</svg>
